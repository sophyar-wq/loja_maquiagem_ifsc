<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro — Sephiana</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rose:    #c97d8e;
    --rose-lt: #f7edf0;
    --rose-dk: #7a3f4e;
    --ink:     #1c1517;
    --muted:   #7a6e70;
    --line:    #e8dde0;
    --surface: #fdf8f9;
    --white:   #ffffff;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--surface);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .split {
    display: flex;
    width: 100%;
    max-width: 860px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }

  .brand-panel {
    width: 42%;
    background: #2b1820;
    padding: 3rem 2.5rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .brand-panel .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: #e8c5ce;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .brand-panel .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2rem;
    font-weight: 400;
    color: #f7edf0;
    line-height: 1.3;
    margin-top: auto;
  }

  .brand-panel .tagline em {
    color: var(--rose);
    font-style: italic;
  }

  .brand-panel .note {
    font-size: 0.78rem;
    color: #9a8385;
    margin-top: 2rem;
    line-height: 1.6;
  }

  .form-panel {
    flex: 1;
    padding: 3rem 2.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .form-panel h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.9rem;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 0.4rem;
  }

  .form-panel .subtitle {
    font-size: 0.83rem;
    color: var(--muted);
    margin-bottom: 2rem;
  }

  .field {
    margin-bottom: 1.2rem;
  }

  label {
    display: block;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }

  input {
    width: 100%;
    padding: 0.7rem 1rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--surface);
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: var(--rose);
    background: var(--white);
  }

  input::placeholder { color: #c4b8bb; }

  .btn-primary {
    width: 100%;
    padding: 0.85rem;
    background: var(--rose);
    color: var(--white);
    border: none;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: background 0.2s, transform 0.1s;
  }

  .btn-primary:hover { background: #b5697a; }
  .btn-primary:active { transform: scale(0.99); }

  .footer-link {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.82rem;
    color: var(--muted);
  }

  .footer-link a {
    color: var(--rose);
    text-decoration: none;
    font-weight: 500;
  }

  .footer-link a:hover { text-decoration: underline; }

  .toast {
    display: none;
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--white);
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-size: 0.85rem;
    z-index: 99;
    animation: fadeup 0.3s ease;
  }

  @keyframes fadeup {
    from { opacity: 0; transform: translateX(-50%) translateY(8px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  @media (max-width: 640px) {
    .split { flex-direction: column; }
    .brand-panel { width: 100%; padding: 2rem; min-height: unset; }
    .brand-panel .tagline { font-size: 1.7rem; margin-top: 1rem; }
    .form-panel { padding: 2rem; }
  }
</style>
</head>
<body>

<div class="split">
  <div class="brand-panel">
    <span class="logo">Sephiana</span>
    <div>
      <p class="tagline">Beleza que <em>transforma.</em> Cuidado que permanece.</p>
      <p class="note">Junte-se a milhares de pessoas que encontraram aqui a sua rotina de beleza ideal.</p>
    </div>
  </div>

  <div class="form-panel">
    <h2>Criar conta</h2>
    <p class="subtitle">Preencha os dados abaixo para começar</p>

    <div class="field">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" placeholder="Seu nome">
    </div>

    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com">
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Mínimo 6 caracteres">
    </div>

    <button class="btn-primary" onclick="salvarUsuario()">Criar conta</button>

    <p class="footer-link">
      Já tem conta? <a href="login.html">Entrar</a>
    </p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}

async function salvarUsuario() {
  const nome  = document.getElementById('nome').value.trim();
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;

  if (!nome || !email || !senha) {
    showToast('Preencha todos os campos.');
    return;
  }

  try {
    const resposta = await fetch('http://localhost:3000/usuarios', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome, email, senha })
    });
    const dados = await resposta.json();
    showToast(dados.mensagem);
  } catch {
    showToast('Erro ao conectar com o servidor.');
  }
}
</script>

</body>
</html>
